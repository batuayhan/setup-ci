name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npx jest --ci --coverage --passWithNoTests

      # gitleaks-action@v2 leaves gitleaks.tmp in the temp dir behind on self-hosted runners and the next run then fails
      # with "Destination file path ... already exists" (a pass/fail alternation that is not a leak). Clear it before
      # the scan and again afterwards, even when the scan fails. It is $TMPDIR, not $RUNNER_TEMP: measured on the
      # self-hosted runners, whose .env sets TMPDIR to <runner>/_tmp, that is where gitleaks writes (gitleaks-8.x dirs and
      # stale gitleaks.tmp files sit in _tmp; <runner>/_work/_temp holds none of them).
      - name: Clear stale gitleaks temp file
        run: rm -f "${TMPDIR:-/tmp}/gitleaks.tmp"

      - name: Secret leak scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up gitleaks temp file
        if: always()
        run: rm -f "${TMPDIR:-/tmp}/gitleaks.tmp"

      - name: i18n check
        run: npm run check:i18n || echo "::warning::Missing i18n translations found"

      - name: Bundle size
        run: |
          npx expo export --platform web 2>/dev/null || true
          if [ -d "dist" ]; then
            SIZE=$(du -sk dist/ | cut -f1)
            echo "### Bundle Size: ${SIZE}KB" >> $GITHUB_STEP_SUMMARY
            rm -rf dist/
          fi
