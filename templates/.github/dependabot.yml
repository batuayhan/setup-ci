version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    ignore:
      # SDK-bound: these move only through a deliberate Expo SDK upgrade.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
